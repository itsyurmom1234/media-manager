services:
  gateway:
    image: traefik:v3.6
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${GATEWAY_PORT:-8080}:80"
      - "${GATEWAY_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - media-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - media-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - media-net

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - media-net

  download-api:
    build: ./download-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-media}:${POSTGRES_PASSWORD:-media}@postgres:5432/${POSTGRES_DB:-media}
      DOWNLOAD_DIR: /downloads
      SHOWS_DIR: /shows
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
      - ${SHOWS_PATH:-./shows}:/shows
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.download-api.rule=PathPrefix(`/downloads`)"
      - "traefik.http.routers.download-api.priority=10"
      - "traefik.http.services.download-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.download-api-strip.stripprefix.prefixes=/downloads"
      - "traefik.http.routers.download-api.middlewares=download-api-strip"
    networks:
      - media-net

  download-worker:
    build: ./download-service
    command: python -m app.worker
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-media}:${POSTGRES_PASSWORD:-media}@postgres:5432/${POSTGRES_DB:-media}
      DOWNLOAD_DIR: /downloads
      SHOWS_DIR: /shows
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
      - ${SHOWS_PATH:-./shows}:/shows
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - media-net

volumes:
  redis-data:
  postgres-data:

networks:
  media-net:
    driver: bridge
